<!-- index.html-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Example</title>
    <style>
        *{
    margin: 0;
    padding: 0;
}
.main{
    display: flex;
    background-color: aqua;
    height: 100vh;
    flex-wrap: wrap;
    align-content: start;
    
}

.main>div{
    background-color: blueviolet;
    width: 100px;
    height: 100px;
}


.main>:nth-child(3){
    flex-basis: 100%;
}
    </style>
</head>

<body>
    <div class="main">
        <div class="div">1</div>
        <div class="div">2</div>
        <div>3</div>
    </div>

    
</body>

</html>
